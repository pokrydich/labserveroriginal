stages:
  - secrets_information
  - integration_test

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  COMPOSE_PROJECT_NAME: labserverintegration
  NET_NAME: gitlab_net
  LABSERVER_API_BASE:   "http://admin.labserver.local/"
  LABSERVER_NGINX_BASE: "http://admin.labserver.local/"
  LABSERVER_GITLAB_BASE: "http://git.labserver.local/"
  LABSERVER_DB_CONNECTION: "Host=db;Port=5432;Database=labs;Username=postgres;Password=123456;Timeout=10"

generate:dotenv:
  stage: secrets_information
  image: alpine:3.20
  script:
    - apk add --no-cache bash openssl gettext
    - JWT_SECURITY_KEY="$(openssl rand -hex 32)"
    - GITLAB_PAT="glpat-$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')"
    - |
      cat > CI-CD/generated.env <<EOF
      JWT_SECURITY_KEY=${JWT_SECURITY_KEY}
      GITLAB_PAT=${GITLAB_PAT}
      EOF

      source CI-CD/generated.env

    - |
      if [ -f CI-CD/appsettings.template.json ]; then
        echo "Building Server/appsettings.docker.json from template with env vars"
        export JWT_SECURITY_KEY GITLAB_PAT
        envsubst < CI-CD/appsettings.template.json > Server/appsettings.docker.json
      else
        echo "CI-CD/appsettings.template.json not found — skip generating appsettings" >&2
      fi

  artifacts:
    reports:
      dotenv: CI-CD/generated.env
    paths:
      - CI-CD/generated.env
      - Server/appsettings.docker.json

test:integration:
  stage: integration_test
  image: docker:25.0.4
  needs: ["generate:dotenv"]
  services:
    - name: docker:25.0.4-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl docker-cli-compose postgresql-client
    - |
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i+1)); [ $i -gt 60 ] && echo "Docker daemon not ready" && exit 1
        echo "Waiting for Docker daemon..."; sleep 2
      done
    - docker compose version

    # Сеть для всех сервисов
    - docker network inspect "${NET_NAME}" >/dev/null 2>&1 || docker network create "${NET_NAME}"

    # Собираем образы (nginx и labserver)
    - docker compose -f compose.yml -f compose.integration-ci.yml build webserver labserver

    # 1) Поднимаем ТОЛЬКО БД и ждём, пока она действительно примет соединения
    - docker compose -f compose.yml -f compose.integration-ci.yml up -d db
    - |
      echo "Waiting for Postgres (db) to be ready..."
      for i in $(seq 1 60); do
        if docker compose -f compose.yml -f compose.integration-ci.yml exec -T db \
            pg_isready -h localhost -p 5432 -d labs -U postgres >/dev/null 2>&1; then
          echo "Postgres is ready"; break
        fi
        echo "db not ready yet... ($i/60)"; sleep 2
        if [ $i -eq 60 ]; then
          echo "Postgres NOT ready"
          docker compose -f compose.yml -f compose.integration-ci.yml logs db | tail -n 200 || true
          exit 1
        fi
      done

    # 2) Применяем EF-миграции к БД внутри сервиса tests (без изменения compose.yml)
    - >
      docker compose -f compose.yml -f compose.integration-ci.yml run --rm tests
      bash -lc '
        set -euo pipefail
        cd Server
        dotnet new tool-manifest >/dev/null 2>&1 || true
        dotnet tool install dotnet-ef >/dev/null 2>&1 || true
        dotnet tool restore
        echo "Applying EF migrations to: $LABSERVER_DB_CONNECTION"
        dotnet ef migrations add init
        dotnet ef database update --connection "$LABSERVER_DB_CONNECTION"
      '

    # 3) Теперь поднимаем webserver и labserver (схема уже есть)
    - docker compose -f compose.yml -f compose.integration-ci.yml up -d webserver labserver

    # 4) Проверяем резолв имени и готовность admin.labserver.local
    - docker compose -f compose.yml -f compose.integration-ci.yml run --rm tests getent hosts admin.labserver.local
    - |
      echo "Waiting for admin.labserver.local /health ..."
      for i in $(seq 1 120); do
        if docker compose -f compose.yml -f compose.integration-ci.yml run --rm tests \
             curl -fsS -o /dev/null http://admin.labserver.local/health; then
          echo "admin.labserver.local is ready"; break
        fi
        echo "not ready yet... ($i/120)"; sleep 2
        if [ $i -eq 120 ]; then
          echo "admin.labserver.local NOT ready"
          docker compose -f compose.yml -f compose.integration-ci.yml ps
          docker logs $(docker compose -f compose.yml -f compose.integration-ci.yml ps -q webserver) | tail -n 200 || true
          exit 1
        fi
      done

  script:
    - mkdir -p TestResults
    # 5) Запускаем тесты с подробным консольным логированием (видно Console.WriteLine в job-логе) и выгрузкой .trx
    - >
      docker compose -f compose.yml -f compose.integration-ci.yml run --rm tests bash -c "
        echo 'Testing connection from inside container...';
        curl -X POST http://admin.labserver.local/api/Login \
          -H \"Content-Type: application/json\" \
          -d '{\"email\": \"test_mail_first@test.dev\", \"password\": \"1qaz@WSX\"}' -v;
        dotnet test Server.IntegrationTests/Server.IntegrationTests.csproj \
          --configuration Release \
          --filter 'FullyQualifiedName~Server.IntegrationTests.Database|FullyQualifiedName~Server.IntegrationTests.Api' \
          --logger 'console;verbosity=detailed' \
          --logger 'trx;LogFileName=/workspace/TestResults/integration.trx' \
          --verbosity normal
        "

  after_script:
    # - docker logs $(docker compose -f compose.yml -f compose.integration-ci.yml ps -q labserver) | head -n 150
    # - docker logs $(docker compose -f compose.yml -f compose.integration-ci.yml ps -q webserver) | head -n 150

    - docker compose -f compose.yml -f compose.integration-ci.yml down

  artifacts:
    when: always
    paths:
      - TestResults/
