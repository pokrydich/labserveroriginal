stages:
  - build
  - test_unit
  - publish
  - deploy

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

build_backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - dotnet restore LabServer.sln
    - dotnet build LabServer.sln --configuration Release --no-restore

unit_tests:
  stage: test_unit
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - dotnet restore LabServer.sln
    - dotnet build LabServer.sln --configuration Release --no-restore
    - dotnet test Server.Tests/LabServer.Server.Tests.csproj --configuration Release --no-build /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:CoverletOutput=TestResults/coverage.info
  coverage: '/Total.*?([0-9]+\.[0-9]+)/'
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      coverage_report:
        coverage_format: lcov
        path: TestResults/coverage.info
