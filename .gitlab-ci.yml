stages:
  - build
  - integration_test

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  COMPOSE_PROJECT_NAME: labserverintegration
  NET_NAME: gitlab_net
  LABSERVER_API_BASE:   "http://admin.labserver.local/"
  LABSERVER_NGINX_BASE: "http://admin.labserver.local/"
  LABSERVER_GITLAB_BASE: "http://git.labserver.local/"
  LABSERVER_DB_CONNECTION: "Host=db;Port=5432;Database=labs;Username=postgres;Password=123456;Timeout=10"

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - dotnet restore
    - dotnet build --configuration Release

integration_test:
  stage: integration_test
  image: docker:25.0.4
  services:
    - name: docker:25.0.4-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl docker-cli-compose
    - |
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i+1)); [ $i -gt 60 ] && echo "Docker daemon not ready" && exit 1
        echo "Waiting for Docker daemon..."; sleep 2
      done
    - docker compose version
    # Создаём внешнюю сеть внутри dind-демона (важно!)
    - docker network inspect "${NET_NAME}" >/dev/null 2>&1 || docker network create "${NET_NAME}"
    # Поднимаем то же, что у тебя
    - docker compose -f compose.yml -f compose.integration-ci.yml up -d --build db labserver webserver

    # === Новые readiness-пробы: реальный DNS-алиас ===
    - docker compose run --rm tests getent hosts admin.labserver.local
    - |
      echo "Waiting for admin.labserver.local ..."
      for i in $(seq 1 180); do
        if docker compose run --rm tests \
             curl -fsS -o /dev/null http://admin.labserver.local/; then
          echo "admin.labserver.local is ready"; break
        fi
        sleep 2
        if [ $i -eq 180 ]; then
          echo "admin.labserver.local NOT ready"
          docker ps
          docker logs $(docker compose ps -q webserver) | tail -n 200 || true
          exit 1
        fi
      done

  script:
    - mkdir -p TestResults
    # Запускаем тесты из сервиса `tests` (будут в той же сети и с alias’ами)
    - >
      docker compose -f compose.yml -f compose.integration-ci.yml run --rm tests
      dotnet test Server.IntegrationTests/Server.IntegrationTests.csproj
      --configuration Release
      --logger "trx;LogFileName=/workspace/TestResults/integration.trx"

  after_script:
    - docker compose -f compose.yml -f compose.integration-ci.yml down

  artifacts:
    when: always
    paths:
      - TestResults/