services:
  labserver: {}

  webserver:
    ports: []
    networks:
      gitlab_net:
        aliases:
          - webserver
          - admin.labserver.local
          - my.labserver.local

  db:
    ports: []

  gitlab:
    ports: []
    networks:
      gitlab_net:
        aliases:
          - gitlab
          - git.labserver.local
          - labserver.local

  tests:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      LABSERVER_API_BASE:   ${LABSERVER_API_BASE}
      LABSERVER_NGINX_BASE: ${LABSERVER_NGINX_BASE}
      LABSERVER_DB_CONNECTION: ${LABSERVER_DB_CONNECTION}
      LABSERVER_GITLAB_BASE: ${LABSERVER_GITLAB_BASE}
    networks:
      - gitlab_net