services:
  labserver:
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5288" 
    networks:
      - gitlab_net

  webserver:
    build:
      context: .
      dockerfile: nginx/Dockerfile.ci
    volumes: []
    networks:
      gitlab_net:
        aliases:
          - webserver
          - admin.labserver.local
          - my.labserver.local
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 40
      start_period: 10s


  db:
    ports: []

  gitlab:
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://git.labserver.local'
        nginx['redirect_http_to_https'] = false
        letsencrypt['enable'] = false
        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        sidekiq['concurrency'] = 4

    ports: []
    networks:
      gitlab_net:
        aliases:
          - gitlab
          - git.labserver.local
          - labserver.local

  tests:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      LABSERVER_API_BASE:       ${LABSERVER_API_BASE}
      LABSERVER_NGINX_BASE:     ${LABSERVER_NGINX_BASE}
      LABSERVER_DB_CONNECTION:  ${LABSERVER_DB_CONNECTION}
      LABSERVER_GITLAB_BASE:    ${LABSERVER_GITLAB_BASE}
    networks:
      - gitlab_net
