# nginx/conf/admin.labserver.conf
server {
  listen 80;
  server_name admin.labserver.local my.labserver.local;

  # --- static SPA (Angular) ---
  # Angular 17+ по умолчанию кладёт файлы в подкаталог browser/
  root /var/www/sites/admin/browser;

  # здоровье для CI readiness
  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Раздача статики и SPA-фоллбек
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- API / WebSocket прокси на ASP.NET Core (Kestrel) ---
  # если твой API висит под /api — можно ограничить location ^~ /api/
  location /api/ {
    proxy_pass         http://labserver:5288;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Пример для SignalR/WebSockets (если используешь /hubs)
  location /hubs/ {
    proxy_pass         http://labserver:5288;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "Upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}