server {
  listen 80;
  server_name dashboard.labserver.local;

  root /var/www/sites/dashboard/browser;

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # при необходимости — отдельный прокси на API/хабы
  # location /api/ { proxy_pass http://labserver:5288; ... }
  # location /hubs/ { proxy_pass http://labserver:5288; ... }
}
